<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우렁이 슬픔"> <style> .wr2-woorung-sad-body{animation:wr2-woorung-sad-sob 0.6s ease-in-out infinite} .wr2-woorung-sad-t1{animation:wr2-woorung-sad-fall 1.1s ease-in infinite} .wr2-woorung-sad-t2{animation:wr2-woorung-sad-fall 1.1s ease-in 0.55s infinite} @keyframes wr2-woorung-sad-sob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}} @keyframes wr2-woorung-sad-fall{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{transform:translateY(15px);opacity:1}100%{transform:translateY(19px);opacity:0}}</style> <g class="wr2-woorung-sad-body"> <!-- 뚱뚱 찹쌀떡 몸 (손그림 울퉁불퉁) --> <path d="M70 42 C 89 41, 106 50, 112 65 C 117 77, 119 94, 112 106 C 104 119, 90 125, 70 125 C 50 126, 35 119, 27 106 C 20 94, 22 77, 28 64 C 34 50, 51 43, 70 42 Z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.6" stroke-linejoin="round"/> <!-- 콩알 발 --> <path d="M50 124 q4 6 10 1" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <path d="M80 125 q4 6 10 0" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <!-- 아무것도 못 할 것 같은 짜리몽땅 팔 --> <path class="wr2-woorung-sad-armL" d="M27 92 q-9 3 -7 11 q8 2 10 -4 q1 -5 -3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <path class="wr2-woorung-sad-armR" d="M113 92 q9 3 7 11 q-8 2 -10 -4 q-1 -5 3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <!-- 스킨별 시그니처 장식 --> <g> <circle cx="103" cy="52" r="15" fill="#BBD7C0" stroke="#7FA78C" stroke-width="3"/> <path d="M103 52 m0 -9 a9 9 0 1 1 -9 9 a6.4 6.4 0 1 0 6.4 -6.4 a4 4 0 1 1 -4 4" fill="none" stroke="#7FA78C" stroke-width="2.2" stroke-linecap="round"/> </g> <path d="M36 50 q30 -16 62 -4" fill="none" stroke="#B79B7C" stroke-width="2.2" opacity="0.5"/> <g transform="rotate(-8 44 42)"> <circle cx="44" cy="42" r="7.5" fill="#F4F7F6" stroke="#8FA8B8" stroke-width="2.6"/> <circle cx="44" cy="42" r="2.6" fill="#C9D8E2"/> </g> <!-- 큼직한 볼터치 (얼굴 아래쪽) --> <circle class="wr2-woorung-sad-cheek" cx="42" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <circle class="wr2-woorung-sad-cheek" cx="98" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <path d="M47 83 l8 6 M55 83 l-8 6" stroke="#3F352A" stroke-width="2.8" stroke-linecap="round"/> <path d="M85 83 l8 6 M93 83 l-8 6" stroke="#3F352A" stroke-width="2.8" stroke-linecap="round"/> <path d="M56 99 q4 -4 7 0 q3 4 7 0 q3 -4 7 0 q3 4 7 0" fill="none" stroke="#3F352A" stroke-width="2.8" stroke-linecap="round"/> <!-- 얼굴 위에 얹히는 시그니처 (안경처럼 눈을 가리면 안 되는 것) --> <!-- 옷장에서 착용한 아이템 — 방 안 우렁이와 탈의실에서만 입는다. 채팅 아바타·이모티콘까지 옷이 따라다니면 표정이 묻힌다. --> </g><g class="wr2-woorung-sad-t1"><path d="M46 90 q4 6.5 0 9.5 q-4 -3 0 -9.5" fill="#A9CDEC"/></g> <g class="wr2-woorung-sad-t2"><path d="M94 90 q4 6.5 0 9.5 q-4 -3 0 -9.5" fill="#A9CDEC"/></g>
</svg>
