<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우렁의사 프로로 이동합니다</title>
  <style>
    body { font-family: 'Noto Sans KR', -apple-system, sans-serif; background: #faf5ee; color: #362f28;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1.5rem; }
    .box { max-width: 340px; text-align: center; }
    h1 { font-size: 1.1rem; margin: 0 0 0.6rem; }
    p { font-size: 0.86rem; color: #7f7264; line-height: 1.6; margin: 0 0 1.2rem; }
    a { display: inline-block; background: #1c3027; color: #f2ede4; text-decoration: none;
        font-weight: 700; font-size: 0.92rem; padding: 0.8rem 1.5rem; border-radius: 999px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>상담사 페이지가 따로 나왔어요</h1>
    <p>이제 <b>우렁의사 프로</b>라는 별도 앱에서 예약·채팅·통화를 관리합니다.<br>잠시 후 자동으로 이동해요.</p>
    <a id="go" href="./pro/index.html">우렁의사 프로 열기</a>
  </div>
  <script>
    // 예전에 보낸 이메일·북마크가 아직 /counselor.html 을 가리킨다.
    //  끊어버리면 상담사가 로그인할 방법을 잃으므로 문을 열어둔 채 넘긴다.
    (function () {
      var h = location.hostname;
      var to = /(^|\.)neurumind\.com$/.test(h) ? 'https://pro.neurumind.com/'
             : /\.pages\.dev$/.test(h)         ? 'https://neurumind-pro.pages.dev/'
             : './pro/index.html';
      to += location.search + location.hash;   // 매직링크 토큰(?t=…)을 잃지 않는다
      document.getElementById('go').href = to;
      setTimeout(function () { location.replace(to); }, 1200);
    })();
  </script>
</body>
</html>
