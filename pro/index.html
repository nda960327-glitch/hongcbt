<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>우렁의사 프로 — 상담사용</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1c3027">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf5ee; --card: #ffffff; --line: rgba(120, 96, 66, 0.14);
      --text: #362f28; --sub: #7f7264; --accent: #4f8a6b; --accent-soft: #eef6f0;
      --danger: #cf6b60; --warn: #e8590c; --gold: #b98a1a;
      --tabh: 58px;
      /* 그림자를 값이 아니라 이름으로 쓴다 — 카드마다 제각각이면 '앱'이 아니라 '문서'로 보인다 */
      --sh1: 0 2px 10px rgba(120, 96, 66, 0.06);
      --sh2: 0 6px 18px rgba(120, 96, 66, 0.10);
      --sh3: 0 14px 34px rgba(120, 96, 66, 0.14);
    }
    /* 한국어는 음절 사이 어디서나 끊긴다 — flex 안에서 칸이 한 글자로
       찌그러지는 원인이다. 소비자 앱(css/style.css)과 같은 규칙을 쓴다.
       anywhere 가 아니라 break-word 여야 한다(anywhere 는 최소 폭을 도로 1글자로 만든다). */
    * { box-sizing: border-box; margin: 0; word-break: keep-all; overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5; overscroll-behavior-y: none;
      /* 통화를 축소하면 화면 맨 위를 미니바가 차지한다 — 그만큼 내용을 밀어야
         제목이 미니바에 가려지지 않는다. 통화가 없으면 0이라 아무 일도 안 일어난다. */
      padding-top: var(--callbar-h, 0px);
    }
    [hidden] { display: none !important; }
    input, button, textarea, select { font-family: inherit; font-size: 0.92rem; color: inherit; }
    .serif { font-family: 'Gowun Batang', serif; }

    /* ── 로그인 ───────────────────────────────────────────────── */
    #screen-login { max-width: 420px; margin: 0 auto; padding: 3.4rem 1.2rem 2rem; }
    #screen-login .logo { text-align: center; margin-bottom: 1.6rem; }
    #screen-login .logo h1 { font-family: 'Gowun Batang', serif; font-size: 1.5rem; letter-spacing: -0.01em; }
    #screen-login .logo p { font-size: 0.78rem; color: var(--sub); margin-top: 0.3rem; }
    #screen-login .mark {
      width: 58px; height: 58px; border-radius: 20px; margin: 0 auto 0.8rem;
      background: linear-gradient(140deg, #5d9a79, #3d6f58); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Gowun Batang', serif; font-size: 1.5rem;
      box-shadow: 0 8px 20px rgba(79, 138, 107, 0.28);
    }

    /* ── 공통 조각 ────────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.1rem; box-shadow: 0 2px 10px rgba(120, 96, 66, 0.06); margin-bottom: 0.7rem;
    }
    .card.flat { box-shadow: none; }
    .card.pad0 { padding: 0; }
    .muted { font-size: 0.78rem; color: var(--sub); line-height: 1.65; }
    .row { display: flex; align-items: center; gap: 0.5rem; }
    .grow { flex: 1; min-width: 0; }
    .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 섹션 제목 앞 작은 막대 — 스크롤 중에도 '여기서 새 덩어리가 시작한다'가 보인다 */
    .sec-title {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; font-weight: 700; color: var(--sub); letter-spacing: 0.02em; margin: 1.3rem 0 0.5rem 0.2rem;
    }
    .sec-title::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); opacity: 0.5; flex-shrink: 0; }
    .sec-title:first-child { margin-top: 0.2rem; }
    .sec-title .right { margin-left: auto; font-weight: 600; }

    input[type=text], input[type=password], input[type=number], input[type=tel],
    input[type=email], input:not([type]), textarea {
      width: 100%; padding: 0.72rem 0.9rem; border-radius: 12px; border: 1.5px solid var(--line);
      background: #fff; outline: none; transition: border-color 0.15s;
    }
    /* 포커스는 테두리 색만 바꾸면 실내 조명에서 거의 안 보인다 — 옅은 링을 같이 준다 */
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(79, 138, 107, 0.13); }
    .btn:focus-visible, .iconbtn:focus-visible, .tab:focus-visible, .sw:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    #code { text-align: center; letter-spacing: 0.12em; background: var(--bg); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      width: 100%; min-height: 46px; padding: 0.7rem 1rem; border: none; border-radius: 13px;
      background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.985); }
    .btn:disabled { opacity: 0.55; }
    .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
    .btn.soft { background: var(--accent-soft); color: var(--accent); }
    .btn.danger { background: var(--danger); }
    .btn.sm { width: auto; min-height: 36px; padding: 0.4rem 0.8rem; font-size: 0.78rem; border-radius: 10px; }

    .chip {
      display: inline-flex; align-items: center; font-size: 0.68rem; font-weight: 800;
      padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap;
    }
    .chip.new { color: var(--warn); background: rgba(232, 89, 12, 0.12); }
    .chip.ok { color: var(--accent); background: var(--accent-soft); }
    .chip.off { color: var(--sub); background: var(--bg); border: 1px solid var(--line); }
    .chip.bad { color: var(--danger); background: rgba(207, 107, 96, 0.12); }
    .chip.gold { color: var(--gold); background: rgba(245, 199, 78, 0.2); }

    .empty { text-align: center; padding: 2.2rem 1rem; color: var(--sub); font-size: 0.86rem; line-height: 1.8; }
    /* 빈 화면에 글자만 있으면 '고장'처럼 보인다. 손그림 선화를 하나씩 둔다 */
    .empty svg { display: block; margin: 0 auto 0.7rem; width: 104px; height: 78px; color: #cbbda7; }
    .empty b { display: block; color: var(--text); font-size: 0.9rem; margin-bottom: 0.15rem; }

    /* ── 검색창 ───────────────────────────────────────────────── */
    .searchbar {
      display: flex; align-items: center; gap: 0.5rem; background: #fff;
      border: 1.5px solid var(--line); border-radius: 999px; padding: 0.2rem 0.85rem;
      margin-bottom: 0.65rem; box-shadow: var(--sh1); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .searchbar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(79, 138, 107, 0.13); }
    .searchbar svg { color: var(--sub); flex-shrink: 0; }
    .searchbar input { border: none !important; background: transparent; padding: 0.5rem 0; border-radius: 0; }
    .searchbar input:focus { box-shadow: none; }
    .searchbar .x { all: unset; cursor: pointer; color: var(--sub); font-weight: 800; padding: 0 0.2rem; }

    /* ── 세그먼트 토글 (목록 | 달력) ──────────────────────────── */
    .seg { display: inline-flex; background: rgba(120, 96, 66, 0.08); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg button {
      all: unset; padding: 0.34rem 0.95rem; border-radius: 999px; cursor: pointer;
      font-size: 0.76rem; font-weight: 700; color: var(--sub); transition: background 0.16s, color 0.16s;
    }
    .seg button.on { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.09); }

    /* ── 달력 ─────────────────────────────────────────────────── */
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal .dh { font-size: 0.66rem; font-weight: 700; color: var(--sub); text-align: center; padding: 0.25rem 0 0.35rem; }
    .cal .dh.sun { color: var(--danger); }
    .cal .cell {
      all: unset; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; font-size: 0.82rem; border-radius: 11px; cursor: pointer; border: 1.5px solid transparent;
      transition: background 0.15s, color 0.15s;
    }
    .cal .cell.off { color: var(--sub); opacity: 0.35; }
    .cal .cell.today { border-color: var(--accent); font-weight: 800; color: var(--accent); }
    .cal .cell.sel { background: var(--accent); color: #fff; font-weight: 800; border-color: var(--accent); }
    .cal .cell i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .cal .cell i.warn { background: var(--warn); }
    .cal .cell.sel i { background: #fff; }
    .cal .cell .pad { height: 5px; }

    /* ── 홈 인사 히어로 ───────────────────────────────────────── */
    .hero {
      position: relative; overflow: hidden; margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #eff7f1 0%, #fffdf8 62%);
      border: 1px solid var(--line); border-radius: 20px; padding: 1.05rem 1.15rem; box-shadow: var(--sh2);
    }
    .hero::after {
      content: ''; position: absolute; right: -34px; top: -46px; width: 128px; height: 128px;
      border-radius: 50%; background: rgba(79, 138, 107, 0.09);
    }
    .hero .date { font-size: 0.72rem; color: var(--sub); letter-spacing: 0.02em; }
    .hero .hi { font-family: 'Gowun Batang', serif; font-size: 1.22rem; line-height: 1.45; margin-top: 0.15rem; position: relative; }
    .hero .sub { font-size: 0.8rem; color: var(--sub); margin-top: 0.3rem; position: relative; }
    .hero .sub b { color: var(--accent); }

    /* ── 미니 차트 ────────────────────────────────────────────── */
    .chartwrap svg { display: block; width: 100%; height: auto; }
    .chartlabels { display: flex; margin-top: 0.25rem; }
    .chartlabels span { flex: 1; text-align: center; font-size: 0.64rem; color: var(--sub); }
    .chartlabels span.on { color: var(--accent); font-weight: 800; }

    /* ── 앱 셸 ────────────────────────────────────────────────── */
    #appbar {
      position: sticky; top: 0; z-index: 40; background: rgba(250, 245, 238, 0.94);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top);
    }
    #appbar .inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 1.1rem; }
    #appbar .av {
      width: 38px; height: 38px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(140deg, #5d9a79, #3d6f58); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem;
    }
    #appbar .who { font-size: 0.95rem; font-weight: 700; }
    #appbar .whosub { font-size: 0.72rem; color: var(--sub); }
    .iconbtn {
      all: unset; display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 12px; cursor: pointer; color: var(--sub); flex-shrink: 0;
    }
    .iconbtn:active { background: rgba(120, 96, 66, 0.08); }

    main#views { max-width: 560px; margin: 0 auto; padding: 0.9rem 1.1rem calc(var(--tabh) + 1.6rem + env(safe-area-inset-bottom)); }
    .view { display: none; }
    .view.on { display: block; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    #tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
    }
    #tabbar .inner { max-width: 560px; margin: 0 auto; display: flex; }
    .tab {
      all: unset; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; min-height: var(--tabh); cursor: pointer; color: var(--sub); position: relative;
      font-size: 0.66rem; font-weight: 700;
    }
    .tab.on { color: var(--accent); }
    .tab.on::before {
      content: ''; position: absolute; top: 0; width: 24px; height: 3px;
      border-radius: 0 0 3px 3px; background: var(--accent);
    }
    .tab svg { width: 22px; height: 22px; transition: transform 0.18s; }
    .tab.on svg { transform: translateY(-1px); }
    .tab .dot {
      position: absolute; top: 6px; left: 50%; margin-left: 4px;
      min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
      background: var(--warn); color: #fff; font-size: 0.6rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── 홈 ───────────────────────────────────────────────────── */
    /* 요약 3칸 — 숫자를 크게, 라벨은 muted, 아이콘은 색 배경 위에.
       세 칸이 같은 회색이면 눈이 어디에 먼저 갈지 못 정한다. */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.7rem; }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 0.8rem 0.6rem 0.7rem; cursor: pointer; box-shadow: var(--sh1);
      transition: transform 0.12s, box-shadow 0.16s; text-align: left;
    }
    .stat:active { transform: scale(0.97); box-shadow: var(--sh1); }
    .stat .ic {
      width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 0.45rem;
    }
    .stat .ic svg { width: 16px; height: 16px; }
    .stat.c-warn .ic { background: rgba(232, 89, 12, 0.13); color: var(--warn); }
    .stat.c-blue .ic { background: rgba(107, 143, 191, 0.15); color: #5b7fb0; }
    .stat.c-green .ic { background: var(--accent-soft); color: var(--accent); }
    .stat b { display: block; font-size: 1.32rem; line-height: 1.2; letter-spacing: -0.02em; }
    .stat b .u { font-size: 0.68rem; font-weight: 700; margin-left: 1px; }
    .stat span { font-size: 0.68rem; color: var(--sub); display: block; margin-top: 0.15rem; }

    .switch-card { border: 1.5px solid var(--line); }
    .switch-card.on { border-color: var(--accent); background: linear-gradient(135deg, var(--accent-soft), #fff); }
    .sw {
      all: unset; width: 60px; height: 34px; border-radius: 999px; background: #d8d0c4;
      position: relative; cursor: pointer; flex-shrink: 0; transition: background 0.2s;
    }
    .sw.on { background: var(--accent); }
    .sw i {
      position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); transition: transform 0.2s;
    }
    .sw.on i { transform: translateX(26px); }

    .listrow { display: flex; align-items: center; gap: 0.7rem; padding: 0.75rem 0; border-top: 1px solid var(--line); }
    .listrow:first-child { border-top: none; }

    /* 접이식 섹션 */
    .fold > .head {
      all: unset; display: flex; align-items: center; gap: 0.5rem; width: 100%;
      box-sizing: border-box; cursor: pointer; padding: 0.85rem 1.1rem;
    }
    .fold > .body { padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--line); }
    /* 접이식 섹션 안의 입력 칸. 라벨을 칸 위에 작게 얹는다 —
       한 줄에 나란히 두면 좁은 폰에서 '연락처'가 '연/락/처'로 쪼개진다.
       :first-child 로 좁힌 이유: 칸 아래 붙는 안내문(span.muted)까지 라벨
       모양이 되면, 어디까지가 설명이고 어디부터가 다음 칸인지 알 수 없다. */
    .fold label { display: block; margin-bottom: 0.7rem; }
    .fold label > span:first-child { font-size: 0.76rem; color: var(--sub); display: block; margin-bottom: 0.25rem; }

    /* 프로필 사진 — 매칭 카드의 동그란 자리와 같은 모양으로 미리 보여준다.
       네모로 미리 보여주면 저장한 뒤에야 얼굴이 잘린 걸 알게 된다. */
    .pfoto {
      width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      object-fit: cover; background: var(--bg); border: 1px solid var(--line);
    }

    /* ── 주소 찾기 ────────────────────────────────────────────── */
    /*  우편번호 위젯을 전체화면으로 덮는다. 카드 안 작은 상자에 넣으면
        폰에서 검색 결과가 두세 줄만 보여 아무것도 고르지 못한다.
        팝업(새 창)이 아니라 embed 인 이유: 앱 웹뷰는 window.open 을 막는다. */
    #addrov {
      position: fixed; inset: 0; z-index: 90; background: var(--card);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    }
    #addrov .hd {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 0.8rem 0.65rem 1.1rem; border-bottom: 1px solid var(--line);
    }
    #addrov .hd strong { flex: 1; font-size: 0.95rem; }
    #addrov .hd .muted { display: block; font-weight: 400; }
    #addrbox { flex: 1; min-height: 0; overflow: hidden; }

    /* ── 채팅 ─────────────────────────────────────────────────── */
    .thread { display: flex; gap: 0.75rem; align-items: center; padding: 0.85rem 1rem; cursor: pointer; border-bottom: 1px solid var(--line); }
    .thread:last-child { border-bottom: none; }
    .thread:active { background: var(--bg); }
    /* 아바타는 이름 해시로 파스텔 6색 — 이름을 다 읽기 전에 '누구'인지 색으로 먼저 안다 */
    .pav {
      width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; position: relative;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem;
      font-family: 'Gowun Batang', serif;
    }
    .pav.c0 { background: #fbe4d6; color: #b5643a; }
    .pav.c1 { background: #dcefe2; color: #3f7d5c; }
    .pav.c2 { background: #e5e2f6; color: #6058a3; }
    .pav.c3 { background: #d9ecf4; color: #37718c; }
    .pav.c4 { background: #f8eccd; color: #9c7620; }
    .pav.c5 { background: #f8dfe3; color: #a9556a; }
    .pav.sm { width: 30px; height: 30px; font-size: 0.8rem; }
    .thread.unread .pav::after {
      content: ''; position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px;
      border-radius: 50%; background: var(--warn); border: 2px solid var(--card);
    }
    .thread .nm { font-size: 0.92rem; font-weight: 700; }
    .thread .pv { font-size: 0.8rem; color: var(--sub); }
    .thread.unread .pv { color: var(--text); font-weight: 500; }
    .thread .pv mark { background: rgba(232, 89, 12, 0.18); color: inherit; border-radius: 3px; padding: 0 1px; }
    .thread .rt { font-size: 0.68rem; color: var(--sub); text-align: right; flex-shrink: 0; }
    .thread .cnt {
      display: inline-block; margin-top: 0.3rem; min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 999px; background: linear-gradient(140deg, #f07327, #e04e0c); color: #fff;
      font-size: 0.66rem; font-weight: 800; line-height: 20px; text-align: center;
      box-shadow: 0 2px 6px rgba(224, 78, 12, 0.32);
    }

    /* 대화방 — 탭바 위를 덮는 전체화면 */
    /* inset 뒤의 top 이 이깁니다 — 통화 미니바가 떠 있으면 대화방도 그만큼 내려온다 */
    #chatroom { position: fixed; inset: 0; top: var(--callbar-h, 0px); z-index: 80; background: var(--bg); display: flex; flex-direction: column; }
    #chatroom .rhead {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.8rem;
      padding-top: calc(0.6rem + env(safe-area-inset-top));
      background: rgba(250, 245, 238, 0.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    }
    #chatroom .msgs { flex: 1; overflow-y: auto; padding: 1rem 0.9rem 0.6rem; -webkit-overflow-scrolling: touch; }
    /* 입력부는 [빠른 답장 칩 줄 + 입력창]이 한 덩어리다 — 테두리는 덩어리에 준다 */
    #chatroom .compwrap { background: rgba(255, 255, 255, 0.98); border-top: 1px solid var(--line); }
    #chatroom .comp {
      display: flex; gap: 0.5rem; align-items: flex-end; padding: 0.5rem 0.8rem;
      padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
    }
    #qrbar {
      display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.5rem 0.8rem 0.1rem;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #qrbar::-webkit-scrollbar { display: none; }
    #qrbar button {
      all: unset; flex-shrink: 0; cursor: pointer; font-size: 0.75rem; font-weight: 600;
      padding: 0.33rem 0.75rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
      max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #qrbar button:active { transform: scale(0.96); }
    #qrbar button.edit { background: var(--bg); color: var(--sub); border: 1px solid var(--line); }
    #chatroom .comp textarea {
      flex: 1; max-height: 110px; min-height: 44px; resize: none; border-radius: 22px; padding: 0.7rem 1rem; line-height: 1.4;
    }
    #chatroom .comp .send {
      all: unset; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .daysep { text-align: center; margin: 0.9rem 0 0.7rem; }
    .daysep span { font-size: 0.68rem; color: var(--sub); background: rgba(120, 96, 66, 0.08); padding: 0.22rem 0.7rem; border-radius: 999px; }
    .bub { max-width: 78%; padding: 0.6rem 0.85rem; border-radius: 16px; font-size: 0.89rem; line-height: 1.55; white-space: pre-wrap; }
    .line { display: flex; align-items: flex-end; gap: 0.35rem; margin-bottom: 0.45rem; }
    .line.me { justify-content: flex-end; }
    .line.me .bub { background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
    .line.you .bub { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
    .line .ts { font-size: 0.62rem; color: var(--sub); flex-shrink: 0; padding-bottom: 0.15rem; }

    /* ── 걸려오는 전화 ────────────────────────────────────────── */
    #callov {
      position: fixed; inset: 0; z-index: 200; background: linear-gradient(180deg, #2e4237, #16221c);
      color: #f2ede4; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(3rem + env(safe-area-inset-top)) 1.5rem calc(2.6rem + env(safe-area-inset-bottom));
      text-align: center;
    }
    #callov .pulse {
      width: 128px; height: 128px; border-radius: 50%; background: rgba(255, 255, 255, 0.13);
      margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 2.6rem;
      animation: ringPulse 1.5s ease-in-out infinite;
    }
    @keyframes ringPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.22); } 50% { transform: scale(1.07); box-shadow: 0 0 0 26px rgba(255,255,255,0); } }
    #callov .cbtn {
      all: unset; width: 74px; height: 74px; border-radius: 50%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: #fff;
      font-size: 0.72rem; font-weight: 800;
    }
    #callov .cbtn.yes { background: #3fa06d; box-shadow: 0 6px 20px rgba(63, 160, 109, 0.45); }
    #callov .cbtn.no { background: #d9534f; box-shadow: 0 6px 20px rgba(217, 83, 79, 0.4); }

    /* ── 통화 축소 · 통화 중 채팅 ─────────────────────────────
       전체화면 통화가 화면을 다 덮으면 상담사는 통화하면서 내담자가 방금
       보낸 문장을 볼 수 없다. 축소 버튼과 '채팅 보며 통화'가 그 길을 연다.
       absolute 로 띄우는 이유: #callov 는 space-between 이라 자식을 하나만
       더해도 위아래 배치가 통째로 흔들린다. */
    #callov .minbtn {
      all: unset; position: absolute; top: calc(0.9rem + env(safe-area-inset-top)); left: 0.9rem;
      width: 42px; height: 42px; border-radius: 50%; cursor: pointer; color: #f2ede4;
      display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.13);
    }
    #callov .minbtn:active { transform: scale(0.94); }
    #callov .chatbtn {
      all: unset; display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1rem; cursor: pointer;
      padding: 0.55rem 1.15rem; border-radius: 999px; font-size: 0.82rem; font-weight: 700; color: #f2ede4;
      background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #callov .chatbtn:active { transform: scale(0.97); }
    /* ── 상담 시작 ─────────────────────────────────────────────
       통화는 무료다. 여기서부터가 유료 구간이고, 시간은 서버가 잰다.
       눈에 안 띄면 아무도 안 누르고, 안 누르면 상담사는 한 푼도 못 받는다. */
    #callov .consultbtn {
      all: unset; display: inline-flex; align-items: center; justify-content: center;
      margin-top: 0.9rem; cursor: pointer; min-width: 200px; text-align: center;
      padding: 0.72rem 1.5rem; border-radius: 999px; font-size: 0.94rem; font-weight: 800;
      background: #3fa06d; color: #fff; box-shadow: 0 6px 20px rgba(63, 160, 109, 0.45);
    }
    /* 기다리는 중 — 누를 것이 없다는 걸 색으로 먼저 알린다 */
    #callov .consultbtn.wait { background: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.8); box-shadow: none; }
    /* 상담 중 — 초록(시작)과 같은 색이면 이미 시작한 줄 모른다 */
    #callov .consultbtn.on { background: #b98a1a; box-shadow: 0 6px 20px rgba(185, 138, 26, 0.4); }
    #callov .consultbtn:active { transform: scale(0.97); }
    #call-consult-info { margin-top: 0.8rem; font-size: 0.9rem; font-weight: 800; color: #f5c74e; }
    /* 통화 중에 도착한 메시지 한 줄 — 소리는 내지 않는다(통화 목소리를 덮으면 안 된다) */
    #call-peek {
      all: unset; box-sizing: border-box; position: absolute; left: 0.9rem; right: 0.9rem;
      bottom: calc(9.5rem + env(safe-area-inset-bottom)); cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 0.55rem; background: rgba(255, 255, 255, 0.96); color: #2a2320;
      border-radius: 14px; padding: 0.6rem 0.85rem; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
      animation: peekIn 0.2s ease;
    }
    #call-peek .pk { min-width: 0; }
    #call-peek .pk b { display: block; font-size: 0.74rem; color: var(--accent); }
    #call-peek .pk span { display: block; font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @keyframes peekIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* 통화 미니바 — 축소된 통화. 시트(250)·토스트(300)보다 위여야 한다.
       '통화 화면으로 돌아갈 길'과 '끊을 길'은 무슨 화면 위에서도 사라지면 안 된다. */
    #pro-callbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 400; cursor: pointer;
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.9rem; padding-top: calc(0.5rem + env(safe-area-inset-top));
      background: #3fa06d; color: #fff; font-size: 0.84rem; font-weight: 700;
      box-shadow: 0 2px 10px rgba(30, 25, 20, 0.2);
    }
    /* 한 줄로 못 들어가면 바가 두 줄로 부푼다 — 시계는 그대로 두고 안내 문구만 줄인다 */
    #pro-callbar > span { white-space: nowrap; }
    #pro-callbar .hint { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 500; opacity: 0.85; font-size: 0.73rem; }
    #pro-callbar .end {
      all: unset; margin-left: auto; flex-shrink: 0; cursor: pointer;
      padding: 0.33rem 0.9rem; border-radius: 999px; background: #d9534f; color: #fff;
      font-size: 0.78rem; font-weight: 800;
    }
    #pro-callbar .end:active { transform: scale(0.96); }

    /* ── 바텀시트 (숙제 내기 등) ─────────────────────────────── */
    #sheet { position: fixed; inset: 0; z-index: 250; display: flex; flex-direction: column; justify-content: flex-end; }
    #sheet .bd { position: absolute; inset: 0; background: rgba(30, 25, 20, 0.42); animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #sheet-body {
      position: relative; width: 100%; max-width: 560px; margin: 0 auto; background: var(--bg);
      border-radius: 22px 22px 0 0; max-height: 90vh; overflow-y: auto;
      padding: 0.6rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom));
      animation: slideUp 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0.6; } to { transform: none; opacity: 1; } }
    #sheet-body .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line); margin: 0.3rem auto 0.9rem; }
    #sheet-body h3 { font-size: 1.02rem; margin-bottom: 0.2rem; }
    #sheet-body label { display: block; margin-bottom: 0.7rem; }
    #sheet-body label > span { font-size: 0.76rem; color: var(--sub); display: block; margin-bottom: 0.25rem; }

    /* 시트 안 메뉴 줄 */
    .menurow {
      all: unset; display: flex; align-items: center; gap: 0.7rem; width: 100%; box-sizing: border-box;
      cursor: pointer; padding: 0.85rem 0.9rem; border-radius: 14px; background: var(--card);
      border: 1px solid var(--line); margin-bottom: 0.45rem; font-size: 0.9rem; font-weight: 600;
    }
    .menurow:active { background: var(--accent-soft); }
    .menurow .mi {
      width: 34px; height: 34px; border-radius: 11px; background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .menurow .ms { font-size: 0.72rem; color: var(--sub); font-weight: 500; }

    /* 예약 한 줄 — 시간을 왼쪽에 크게 세워 두면 훑기만 해도 하루가 읽힌다 */
    .bkitem { display: flex; gap: 0.85rem; align-items: flex-start; }
    .bktime {
      width: 62px; flex-shrink: 0; text-align: center; padding: 0.35rem 0; border-radius: 12px;
      background: var(--bg); border: 1px solid var(--line);
    }
    .bktime b { display: block; font-size: 1.02rem; line-height: 1.25; letter-spacing: -0.02em; }
    .bktime span { display: block; font-size: 0.63rem; color: var(--sub); }
    .bktime.hot { background: var(--accent-soft); border-color: rgba(79, 138, 107, 0.35); }
    .bktime.hot b { color: var(--accent); }

    /* 토스트 */
    #toast {
      position: fixed; left: 50%; bottom: calc(var(--tabh) + 1.2rem + env(safe-area-inset-bottom));
      z-index: 300; background: rgba(40, 34, 28, 0.95); color: #fff;
      padding: 0.62rem 1.15rem; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      opacity: 0; pointer-events: none; max-width: 90vw; text-align: center;
      transform: translateX(-50%) translateY(10px); transition: opacity 0.24s, transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 10px 28px rgba(30, 25, 20, 0.3); backdrop-filter: blur(6px);
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- ── 로그인 ───────────────────────────────────────────────── -->
  <div id="screen-login">
    <div class="logo">
      <div class="mark">우</div>
      <h1>우렁의사 프로</h1>
      <p>상담사 전용 · 예약 · 채팅 · 통화 · 정산</p>
    </div>
    <div class="card">
      <p style="font-weight: 700; text-align: center;">상담사 로그인</p>
      <p class="muted" style="text-align: center; margin: 0.35rem 0 0.9rem;">
        입점 승인 시 <b>이메일로 보내드린 코드</b>를 입력하세요.<br>한 번 입력하면 이 기기에서는 계속 열립니다.</p>
      <input id="code" type="password" autocomplete="off" placeholder="열람 코드" inputmode="text">
      <p id="err" class="muted" style="color: var(--danger); display: none; margin-top: 0.5rem; text-align: center;"></p>
      <button class="btn" id="code-btn" style="margin-top: 0.7rem;">시작하기</button>
    </div>
    <p class="muted" style="text-align: center; padding: 0 0.5rem;">
      코드를 잃어버렸거나 코드가 샌 것 같으면 운영팀에 알려주세요.<br>
      바로 새 코드를 보내드립니다 — <b>nda960327@gmail.com</b></p>
  </div>

  <!-- ── 앱 ───────────────────────────────────────────────────── -->
  <div id="app" hidden>
    <div id="appbar">
      <div class="inner">
        <div class="av" id="me-av">우</div>
        <div class="grow">
          <div class="who ell" id="me-name">우렁의사 프로</div>
          <div class="whosub ell" id="me-sub">불러오는 중…</div>
        </div>
        <button class="iconbtn" data-act="settings" title="내 정보" aria-label="내 정보 수정">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.67 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1Z"/></svg>
        </button>
        <button class="iconbtn" data-act="refresh" title="새로고침" aria-label="새로고침">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="iconbtn" data-act="logout" title="잠그기" aria-label="잠그기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </div>

    <main id="views">
      <section class="view on" id="view-home"></section>
      <section class="view" id="view-chat"></section>
      <section class="view" id="view-book"></section>
      <section class="view" id="view-money"></section>
    </main>

    <nav id="tabbar">
      <div class="inner">
        <button class="tab on" data-tab="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>홈</span><span class="dot" id="dot-home" hidden></span>
        </button>
        <button class="tab" data-tab="chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.5 9.5 0 0 1-3.3-.6L3 21l1.8-4.6A8.3 8.3 0 0 1 3.6 11.5C3.6 6.9 7.6 3.5 12.3 3.5S21 6.9 21 11.5Z"/></svg>
          <span>채팅</span><span class="dot" id="dot-chat" hidden></span>
        </button>
        <button class="tab" data-tab="book">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <span>예약</span><span class="dot" id="dot-book" hidden></span>
        </button>
        <button class="tab" data-tab="money">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v12H3z"/><path d="M3 11h18"/><circle cx="8" cy="15" r="1.3"/></svg>
          <span>정산</span><span class="dot" id="dot-money" hidden></span>
        </button>
      </div>
    </nav>
  </div>

  <!-- 대화방 (전체화면) -->
  <div id="chatroom" hidden>
    <div class="rhead">
      <button class="iconbtn" data-act="room-close" aria-label="뒤로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="grow">
        <div style="font-weight: 700; font-size: 0.95rem;" id="room-name" class="ell"></div>
        <div class="muted" id="room-sub"></div>
      </div>
      <!-- 숙제는 예약이 있어야만 낼 수 있던 기능이었다. 스레드에는 clientId 가 있으니
           바로상담만 한 내담자에게도 여기서 바로 낼 수 있다. -->
      <button class="btn soft sm" data-act="call-client" title="이 내담자에게 전화 걸기 (무료)">통화</button>
      <button class="btn soft sm" data-act="hw-open">숙제</button>
      <button class="iconbtn" data-act="room-menu" aria-label="대화 메뉴">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
      </button>
    </div>
    <div class="msgs" id="room-msgs"></div>
    <div class="compwrap">
      <!-- 빠른 답장 칩 — 진료 사이 3분에 답장을 쓰게 하려면 '고르기'가 '타이핑'보다 빨라야 한다 -->
      <div id="qrbar"></div>
      <div class="comp">
        <textarea id="room-input" rows="1" placeholder="메시지를 입력하세요" enterkeyhint="send"></textarea>
        <button class="send" data-act="room-send" aria-label="전송">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 걸려오는 전화 -->
  <div id="callov" hidden>
    <button class="minbtn" id="call-min" data-act="call-min" aria-label="통화 화면 축소" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div>
      <div style="font-size: 0.88rem; opacity: 0.85;" id="call-st">걸려온 상담 전화</div>
      <div style="font-size: 1.05rem; font-weight: 700; margin-top: 0.3rem;" id="call-clock">00:00</div>
    </div>
    <div>
      <div class="pulse">📞</div>
      <h2 class="serif" id="call-who" style="margin: 1.1rem 0 0.25rem; font-size: 1.35rem;">내담자</h2>
      <p style="font-size: 0.78rem; opacity: 0.72;">전화번호는 서로에게 보이지 않아요</p>
      <button class="chatbtn" id="call-chat" data-act="call-chat" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-4.5A8 8 0 0 1 11 4h2a8 8 0 0 1 8 8Z"/></svg>
        채팅 보며 통화
      </button>
      <div id="call-consult-info" hidden></div>
      <button class="consultbtn" id="call-consult" data-act="consult" hidden>상담 시작</button>
    </div>
    <div style="display: flex; gap: 2.2rem;">
      <button class="cbtn no" id="call-btn-no" data-act="call-no">거절</button>
      <button class="cbtn yes" id="call-btn-yes" data-act="call-yes">받기</button>
      <button class="cbtn no" id="call-btn-end" data-act="call-cancel" hidden>종료</button>
    </div>
  </div>

  <!-- 주소 찾기 (카카오 우편번호 서비스를 이 안에 심는다) -->
  <div id="addrov" hidden>
    <div class="hd">
      <strong>주소 찾기
        <span class="muted">건물명·도로명·지번 아무거나 검색해 보세요</span></strong>
      <button class="iconbtn" data-act="addr-close" aria-label="주소 찾기 닫기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="addrbox"></div>
  </div>

  <!-- 바텀시트 (숙제 내기·숙제 결과) -->
  <div id="sheet" hidden>
    <div class="bd" data-act="sheet-close"></div>
    <div id="sheet-body"></div>
  </div>

  <div id="toast"></div>

  <script src="js/rtccall.js?v=171"></script>
  <script src="js/app.js?v=171"></script>
</body>
</html>
