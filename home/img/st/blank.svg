<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우렁이 멍때림"> <style> .wr2-woorung-blank-body{animation:wr2-woorung-blank-drift 3.2s ease-in-out infinite;transform-origin:70px 110px} .wr2-woorung-blank-dots{animation:wr2-woorung-blank-fade 2.4s ease-in-out infinite} @keyframes wr2-woorung-blank-drift{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}} @keyframes wr2-woorung-blank-fade{0%,100%{opacity:0.25}50%{opacity:1}}</style> <g class="wr2-woorung-blank-body"> <!-- 뚱뚱 찹쌀떡 몸 (손그림 울퉁불퉁) --> <path d="M70 42 C 89 41, 106 50, 112 65 C 117 77, 119 94, 112 106 C 104 119, 90 125, 70 125 C 50 126, 35 119, 27 106 C 20 94, 22 77, 28 64 C 34 50, 51 43, 70 42 Z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.6" stroke-linejoin="round"/> <!-- 콩알 발 --> <path d="M50 124 q4 6 10 1" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <path d="M80 125 q4 6 10 0" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <!-- 아무것도 못 할 것 같은 짜리몽땅 팔 --> <path class="wr2-woorung-blank-armL" d="M27 92 q-9 3 -7 11 q8 2 10 -4 q1 -5 -3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <path class="wr2-woorung-blank-armR" d="M113 92 q9 3 7 11 q-8 2 -10 -4 q-1 -5 3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <!-- 스킨별 시그니처 장식 --> <g> <circle cx="103" cy="52" r="15" fill="#BBD7C0" stroke="#7FA78C" stroke-width="3"/> <path d="M103 52 m0 -9 a9 9 0 1 1 -9 9 a6.4 6.4 0 1 0 6.4 -6.4 a4 4 0 1 1 -4 4" fill="none" stroke="#7FA78C" stroke-width="2.2" stroke-linecap="round"/> </g> <path d="M36 50 q30 -16 62 -4" fill="none" stroke="#B79B7C" stroke-width="2.2" opacity="0.5"/> <g transform="rotate(-8 44 42)"> <circle cx="44" cy="42" r="7.5" fill="#F4F7F6" stroke="#8FA8B8" stroke-width="2.6"/> <circle cx="44" cy="42" r="2.6" fill="#C9D8E2"/> </g> <!-- 큼직한 볼터치 (얼굴 아래쪽) --> <circle class="wr2-woorung-blank-cheek" cx="42" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <circle class="wr2-woorung-blank-cheek" cx="98" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <circle cx="52" cy="86" r="2.8" fill="#3F352A"/> <circle cx="88" cy="86" r="2.8" fill="#3F352A"/> <ellipse cx="70" cy="98" rx="4" ry="5" fill="none" stroke="#3F352A" stroke-width="2.4"/> <!-- 얼굴 위에 얹히는 시그니처 (안경처럼 눈을 가리면 안 되는 것) --> <!-- 옷장에서 착용한 아이템 — 방 안 우렁이와 탈의실에서만 입는다. 채팅 아바타·이모티콘까지 옷이 따라다니면 표정이 묻힌다. --> </g><g class="wr2-woorung-blank-dots"><circle cx="108" cy="34" r="2.6" fill="#B7A38B"/><circle cx="117" cy="28" r="3" fill="#B7A38B"/><circle cx="127" cy="21" r="3.4" fill="#B7A38B"/></g>
</svg>
