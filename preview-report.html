<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 마음 리포트 — 레이아웃 미리보기</title>
<style>
  body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#fffdf9;color:#2b2620;
       max-width:720px;margin:0 auto;padding:28px 22px;line-height:1.75;font-size:15px}
  h1{font-size:21px;margin:0 0 2px;letter-spacing:-.02em}
  p.meta{font-size:12px;color:#8a8073;margin:0 0 20px}
  b{font-weight:800}
  section{break-inside:avoid}
</style></head>
<body>
<h1>🔍 AI 마음 리포트 — 레이아웃 미리보기</h1>
<p class="meta">샘플 데이터로 렌더한 실제 보고서 구조입니다 · 표준 선별검사(PHQ-9·GAD-7) + 탐색 지표 구분</p>
<div id="out"></div>

<script src="js/icons.js"></script>
<script src="js/stickers.js"></script>
<script src="js/assess-charts.js"></script>
<script>
const mem={};
window.Storage={_safeGet:(k,d)=>k in mem?mem[k]:d,_safeSet:(k,v)=>{mem[k]=v},
  getThoughtRecords:()=>mem['cbt_thought_records']||[]};
window.ThoughtRecord={distortions:[
  {id:'all-or-nothing',label:'이분법적 사고'},{id:'overgeneralization',label:'과잉일반화'},
  {id:'mental-filter',label:'정신적 필터'},{id:'jumping-conclusions',label:'예단(독심술)'},
  {id:'personalization',label:'개인화'},{id:'labeling',label:'낙인찍기'}]};
</script>
<script src="js/assess.js"></script>
<script>
(function(){
  const now=Date.now(),day=864e5,moods=[];
  for(let i=20;i>=0;i--){const b=2+(20-i)*.08;
    moods.push({ts:now-i*day-3*36e5,emo:'보통',v:Math.max(1,Math.min(5,b+(i%3===0?-.8:.5)))});
    if(i%2===0)moods.push({ts:now-i*day-20*36e5,emo:'불안',v:Math.max(1,b-.6)});}
  mem['cbt_mood_log']=moods;
  mem['cbt_thought_records']=[
    {id:'r1',date:new Date().toISOString(),distortions:['jumping-conclusions','personalization']},
    {id:'r2',date:new Date().toISOString(),distortions:['jumping-conclusions','all-or-nothing']},
    {id:'r3',date:new Date().toISOString(),distortions:['jumping-conclusions']}];
  const f=window.Assess.factCharts();
  const r={id:'demo',date:'2026년 8월 8일 01:00',facts:f,json:{
    reliability:{level:'보통',note:'기록 기간이 3주로 **경향 파악에는 충분**합니다.'},
    headline:'당신은 **거절이 두려워** 먼저 지갑을 엽니다',
    summaryLine:'관계를 잃지 않으려 미리 내주고, 그 대가로 소진됩니다.',
    overall:'전반적으로 **중등도 우울**과 경도 불안이 함께 관찰됩니다. 특히 관계 장면에서 자기희생적 대처가 반복되며, 이는 기분 저하를 유지시키는 고리로 작동합니다.',
    standard:[
      {name:'PHQ-9 우울',score:12,max:27,band:'중등도',bands:[{to:4},{to:9},{to:14},{to:19},{to:27}],note:'**10점 이상**은 전문가 상담 권고 구간이에요.'},
      {name:'GAD-7 불안',score:6,max:21,band:'경도',bands:[{to:4},{to:9},{to:14},{to:21}],note:'일상 기능은 유지되는 수준입니다.'}],
    timePattern:'**일요일 밤**과 **평일 새벽**에 기분이 가장 낮습니다. 혼자 있는 시간대에 반추가 심해지는 전형적 패턴이에요.',
    signals:[{name:'기분 변동',score:62,level:'중간',evidence:'주중·주말 편차가 큼'},
             {name:'반추(곱씹기)',score:78,level:'높음',evidence:'같은 주제가 3회 이상 반복'},
             {name:'주의력·충동',score:35,level:'낮음',evidence:'뚜렷한 신호 없음'},
             {name:'분노·공격성',score:22,level:'낮음',evidence:'관찰되지 않음'}],
    needs:[{name:'인정',score:85},{name:'거절두려움',score:88},{name:'소속',score:72},
           {name:'통제·완벽',score:54},{name:'자율',score:30},{name:'안전',score:46}],
    wellbeing:[{name:'행복도',score:34},{name:'에너지',score:41},{name:'회복탄력성',score:58},
               {name:'자기효능감',score:37},{name:'관계만족',score:29}],
    profileRead:'욕구 레이더가 **거절두려움–인정** 쪽으로 크게 기울어 있고, 자율 축은 눌려 있습니다. 적응 자원 중에서는 회복탄력성만 상대적으로 버티고 있어, **관계 만족을 회복하는 것**이 가장 빠른 지렛대입니다.',
    distortionRead:'**성급한 결론(독심술)**이 압도적으로 많습니다. 상대의 마음을 미리 단정하고 그에 맞춰 행동하는 고리가 보입니다.',
    formulation:{belief:'쓸모가 있어야 사랑받는다',fear:'**거절과 배제**',behavior:'먼저 베풀고 맞춰준다',result:'이용당하고 더 외로워진다'},
    evidence:[
      {claim:'관계에서 **일방적으로 내주는 패턴**이 반복됨',quotes:['최근 세 번 다 내가 냈어','싫다고 말 못 했어'],strength:4},
      {claim:'자기 가치를 타인 평가에 연동',quotes:['인정받지 못하면 내가 없는 것 같아'],strength:3},
      {claim:'야간 반추가 수면을 밀어냄',quotes:['새벽 3시까지 생각이 안 멈춰'],strength:4}],
    whatYouNeed:['거절해도 안 깨지는 관계 **1개**','작은 거절 연습','혼자 있는 시간의 재정의','수면 시작 시간 고정'],
    happinessRx:[
      {week:'1주차',do:'하루 한 번 **작게 거절**하기',why:'거절해도 관계가 유지된다는 경험이 필요해요'},
      {week:'2주차',do:'먼저 지갑 열기 **참아보기**',why:'관계의 근거를 돈에서 분리합니다'},
      {week:'3주차',do:'내 욕구를 한 문장으로 말하기',why:'DEAR MAN — 요청하는 근육 만들기'},
      {week:'4주차',do:'혼자 하는 즐거움 1개 만들기',why:'소속 외의 자원을 확보합니다'}],
    strengths:'자기 감정을 **언어로 표현하는 능력**이 뛰어나고, 힘들 때 도움을 요청할 줄 압니다. 이는 예후에 매우 유리한 요인입니다.',
    referral:'PHQ-9 10점 이상이 2주 넘게 지속되면 정신건강의학과 또는 심리상담을 권합니다. 위기 시 자살예방상담 109, 정신건강상담 1577-0199.',
    limits:'3주간의 앱 기록에 근거하며, 대면 평가·구조화 면담을 대체하지 않습니다.'}};
  document.getElementById('out').innerHTML=window.Assess._reportHtml(r);
})();
</script>
</body></html>
