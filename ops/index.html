<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>우렁의사 운영자 콘솔</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2b3b33">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 색·그림자 이름은 상담사 앱(pro/index.html)과 같은 값을 쓴다.
       두 앱이 미묘하게 다른 초록을 쓰면 같은 서비스로 안 보인다. */
    :root {
      --bg: #faf5ee; --card: #ffffff; --line: rgba(120, 96, 66, 0.14);
      --text: #362f28; --sub: #7f7264; --accent: #4f8a6b; --accent-soft: #eef6f0;
      --danger: #cf6b60; --warn: #e8590c; --gold: #b98a1a; --ink: #2b3b33;
      --sh1: 0 2px 10px rgba(120, 96, 66, 0.06);
      --sh2: 0 6px 18px rgba(120, 96, 66, 0.10);
      --sh3: 0 14px 34px rgba(120, 96, 66, 0.14);
      --side: 224px; --tabh: 60px;
    }
    /* 한국어는 음절 사이 어디서나 끊긴다 — 표 칸이 한 글자로 찌그러지는 원인. */
    * { box-sizing: border-box; margin: 0; word-break: keep-all; overflow-wrap: break-word; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.5;
    }
    [hidden] { display: none !important; }
    input, button, textarea, select { font-family: inherit; font-size: 0.92rem; color: inherit; }
    .serif { font-family: 'Gowun Batang', serif; }
    code, .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    /* ── 로그인 ───────────────────────────────────────────────── */
    #screen-login { max-width: 400px; margin: 0 auto; padding: 4rem 1.2rem 2rem; }
    #screen-login .mark {
      width: 58px; height: 58px; border-radius: 20px; margin: 0 auto 0.8rem;
      background: linear-gradient(140deg, #405a4b, #22322a); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Gowun Batang', serif; font-size: 1.4rem;
      box-shadow: 0 8px 20px rgba(43, 59, 51, 0.28);
    }
    #screen-login h1 { font-family: 'Gowun Batang', serif; font-size: 1.4rem; text-align: center; }
    #screen-login .logo p { font-size: 0.78rem; color: var(--sub); margin-top: 0.3rem; text-align: center; }
    #screen-login .logo { margin-bottom: 1.5rem; }
    #adm-code { text-align: center; letter-spacing: 0.14em; background: var(--bg); }

    /* ── 공통 조각 ────────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 1rem 1.1rem; box-shadow: var(--sh1); margin-bottom: 0.7rem;
    }
    .card.pad0 { padding: 0; }
    .muted { font-size: 0.78rem; color: var(--sub); line-height: 1.65; }
    .row { display: flex; align-items: center; gap: 0.5rem; }
    .wrap { flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sec-title {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.78rem; font-weight: 700; color: var(--sub); letter-spacing: 0.02em; margin: 1.4rem 0 0.5rem 0.2rem;
    }
    .sec-title::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); opacity: 0.5; flex-shrink: 0; }
    .sec-title:first-child { margin-top: 0.2rem; }
    .sec-title .right { margin-left: auto; font-weight: 600; }

    input[type=text], input[type=password], input[type=email], input[type=number], input:not([type]), textarea, select {
      width: 100%; padding: 0.68rem 0.9rem; border-radius: 12px; border: 1.5px solid var(--line);
      background: #fff; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px rgba(79, 138, 107, 0.13); }
    .btn:focus-visible, .iconbtn:focus-visible, .navbtn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
      width: 100%; min-height: 44px; padding: 0.65rem 1rem; border: none; border-radius: 13px;
      background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.985); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.ghost { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
    .btn.soft { background: var(--accent-soft); color: var(--accent); }
    .btn.danger { background: var(--danger); }
    .btn.warnline { background: #fff; color: var(--danger); border: 1.5px solid rgba(207, 107, 96, 0.4); }
    .btn.sm { width: auto; min-height: 34px; padding: 0.35rem 0.75rem; font-size: 0.76rem; border-radius: 10px; }
    .iconbtn {
      all: unset; display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 12px; cursor: pointer; color: var(--sub); flex-shrink: 0;
    }
    .iconbtn:hover { background: rgba(120, 96, 66, 0.08); }

    .chip {
      display: inline-flex; align-items: center; font-size: 0.68rem; font-weight: 800;
      padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap;
    }
    .chip.ok { color: var(--accent); background: var(--accent-soft); }
    .chip.off { color: var(--sub); background: var(--bg); border: 1px solid var(--line); }
    .chip.bad { color: var(--danger); background: rgba(207, 107, 96, 0.12); }
    .chip.gold { color: var(--gold); background: rgba(245, 199, 78, 0.22); }
    .chip.new { color: var(--warn); background: rgba(232, 89, 12, 0.12); }

    .empty { text-align: center; padding: 2rem 1rem; color: var(--sub); font-size: 0.86rem; line-height: 1.8; }
    .empty b { display: block; color: var(--text); font-size: 0.9rem; margin-bottom: 0.15rem; }

    /* ── 앱 셸: 데스크톱은 좌측 사이드바 ──────────────────────── */
    #shell { display: flex; max-width: 1200px; margin: 0 auto; min-height: 100vh; }
    #sidenav {
      width: var(--side); flex-shrink: 0; position: sticky; top: 0; align-self: flex-start;
      height: 100vh; padding: 1.1rem 0.8rem; display: flex; flex-direction: column; gap: 0.2rem;
      border-right: 1px solid var(--line); background: rgba(255, 255, 255, 0.6);
    }
    #sidenav .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0.2rem 0.5rem 1rem; }
    #sidenav .brand .av {
      width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(140deg, #405a4b, #22322a); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      font-family: 'Gowun Batang', serif;
    }
    #sidenav .brand b { font-size: 0.92rem; display: block; }
    #sidenav .brand span { font-size: 0.68rem; color: var(--sub); }
    .navbtn {
      all: unset; display: flex; align-items: center; gap: 0.6rem; cursor: pointer;
      padding: 0.6rem 0.7rem; border-radius: 12px; font-size: 0.88rem; font-weight: 600; color: var(--sub);
      transition: background 0.14s, color 0.14s;
    }
    .navbtn svg { width: 19px; height: 19px; flex-shrink: 0; }
    .navbtn:hover { background: rgba(120, 96, 66, 0.07); color: var(--text); }
    .navbtn.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .navbtn .n {
      margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
      background: var(--warn); color: #fff; font-size: 0.64rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    #sidenav .foot { margin-top: auto; padding: 0.6rem 0.6rem 0; border-top: 1px solid var(--line); }

    main#views { flex: 1; min-width: 0; max-width: 960px; padding: 1.1rem 1.3rem 3rem; }
    #topbar { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.9rem; }
    #topbar h1 { font-size: 1.28rem; font-family: 'Gowun Batang', serif; letter-spacing: -0.01em; }
    #topbar .sub { font-size: 0.74rem; color: var(--sub); margin-top: 0.1rem; }
    .view { display: none; }
    .view.on { display: block; animation: fadeUp 0.18s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    /* ── 모바일: 사이드바 → 하단 탭바 ─────────────────────────── */
    #tabbar { display: none; }
    @media (max-width: 767px) {
      #sidenav { display: none; }
      main#views { max-width: 100%; padding: 0.9rem 1rem calc(var(--tabh) + 1.4rem + env(safe-area-inset-bottom)); }
      #topbar h1 { font-size: 1.1rem; }
      #tabbar {
        display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
      }
      /* 탭이 11개다. 5개로 줄이고 '더보기'를 넣으면 뒤쪽 탭은 아무도 안 쓴다 —
         가로로 밀어서 전부 닿게 한다 (스크롤바는 감춘다). */
      #tabbar .inner {
        display: flex; margin: 0 auto; overflow-x: auto; scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      #tabbar .inner::-webkit-scrollbar { display: none; }
      .tab {
        all: unset; flex: 0 0 auto; width: 19vw; min-width: 62px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; min-height: var(--tabh); cursor: pointer; color: var(--sub); position: relative;
        font-size: 0.6rem; font-weight: 700; text-align: center;
      }
      .tab svg { width: 20px; height: 20px; }
      .tab.on { color: var(--accent); }
      .tab.on::before { content: ''; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
      .tab .n {
        position: absolute; top: 5px; left: 50%; margin-left: 3px;
        min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
        background: var(--warn); color: #fff; font-size: 0.56rem; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
      }
    }

    /* ── 통계 타일 ────────────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 0.55rem; }
    .stat {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 0.85rem 0.9rem; box-shadow: var(--sh1);
    }
    .stat b { display: block; font-size: 1.45rem; line-height: 1.2; letter-spacing: -0.02em; }
    .stat b .u { font-size: 0.66rem; font-weight: 700; margin-left: 2px; color: var(--sub); }
    .stat .lb { font-size: 0.72rem; color: var(--sub); margin-bottom: 0.3rem; font-weight: 600; }
    .stat .sb { font-size: 0.66rem; color: var(--sub); margin-top: 0.2rem; opacity: 0.9; }
    .stat.hi b { color: var(--accent); }

    /* 수익 분배 막대 */
    .splitbar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 0.6rem 0 0.5rem; background: var(--bg); }
    .splitbar i { display: block; height: 100%; }
    .splitlegend { display: flex; flex-wrap: wrap; gap: 0.15rem 1rem; font-size: 0.74rem; color: var(--sub); }
    .splitlegend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .splitlegend i { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

    /* ── 목록 줄 ──────────────────────────────────────────────── */
    .listrow { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.85rem 0; border-top: 1px solid var(--line); }
    .listrow:first-child { border-top: none; }
    .pav {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem;
      font-family: 'Gowun Batang', serif; overflow: hidden;
    }
    .pav img { width: 100%; height: 100%; object-fit: cover; }
    .pav.c0 { background: #fbe4d6; color: #b5643a; } .pav.c1 { background: #dcefe2; color: #3f7d5c; }
    .pav.c2 { background: #e5e2f6; color: #6058a3; } .pav.c3 { background: #d9ecf4; color: #37718c; }
    .pav.c4 { background: #f8eccd; color: #9c7620; } .pav.c5 { background: #f8dfe3; color: #a9556a; }

    .kv { display: grid; grid-template-columns: 76px 1fr; gap: 0.2rem 0.6rem; font-size: 0.78rem; margin-top: 0.5rem; }
    .kv dt { color: var(--sub); }
    .kv dd { color: var(--text); }

    .codebox {
      flex: 1; min-width: 0; font-size: 0.78rem; letter-spacing: 0.03em;
      background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
      padding: 0.35rem 0.55rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 정산 체크 줄 */
    .payrow { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; cursor: pointer; }
    .payrow input { width: 17px; height: 17px; accent-color: var(--accent); flex-shrink: 0; }
    .paybar {
      position: sticky; bottom: 0; background: rgba(255, 255, 255, 0.97); backdrop-filter: blur(8px);
      border: 1px solid var(--line); border-radius: 14px; padding: 0.7rem 0.9rem; box-shadow: var(--sh2);
      display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.7rem;
    }

    /* ── 표 (진단 로그) ───────────────────────────────────────── */
    .tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--sh1); }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 660px; }
    table.tbl th {
      position: sticky; top: 0; z-index: 1; background: #f4efe6; color: var(--sub);
      font-size: 0.7rem; font-weight: 700; text-align: left; padding: 0.55rem 0.7rem; white-space: nowrap;
      border-bottom: 1px solid var(--line);
    }
    table.tbl td { padding: 0.5rem 0.7rem; border-bottom: 1px solid rgba(120, 96, 66, 0.08); vertical-align: top; }
    table.tbl tr:last-child td { border-bottom: none; }
    table.tbl tbody tr:hover { background: rgba(120, 96, 66, 0.04); }
    table.tbl td.t { white-space: nowrap; color: var(--sub); font-variant-numeric: tabular-nums; }
    table.tbl td.msg { color: var(--sub); max-width: 340px; }
    .stg { display: inline-block; font-size: 0.7rem; font-weight: 800; padding: 0.12rem 0.45rem; border-radius: 7px; white-space: nowrap;
           background: var(--bg); color: var(--sub); border: 1px solid var(--line); }
    .stg.fail { background: rgba(207, 107, 96, 0.14); color: #a8342a; border-color: rgba(207, 107, 96, 0.35); }
    .stg.good { background: var(--accent-soft); color: #35664f; border-color: rgba(79, 138, 107, 0.32); }
    .stg.warn { background: rgba(232, 89, 12, 0.12); color: #a1440d; border-color: rgba(232, 89, 12, 0.3); }
    .filters { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.6rem; }
    .filters select, .filters input { width: auto; min-width: 140px; padding: 0.42rem 0.7rem; font-size: 0.8rem; }

    /* ── 진행 중인 통화 ───────────────────────────────────────── */
    /*  '지금 살아 있다'는 건 정지 화면에서 색만으로는 전달되지 않는다.
        맥박처럼 뛰는 점 하나가 표 열 줄보다 빠르게 읽힌다. */
    .card.livecall { border-color: rgba(79, 138, 107, 0.45); background: linear-gradient(180deg, #f4fbf6, #fff); }
    .pulse { width: 11px; height: 11px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
             box-shadow: 0 0 0 0 rgba(79, 138, 107, 0.55); animation: pulse 1.7s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(79, 138, 107, 0.5); }
      70% { box-shadow: 0 0 0 11px rgba(79, 138, 107, 0); }
      100% { box-shadow: 0 0 0 0 rgba(79, 138, 107, 0); }
    }
    /* 움직임에 어지러움을 느끼는 사람이 있다 — 설정을 존중한다 */
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .view.on { animation: none; }
    }

    /* ── 차트 ─────────────────────────────────────────────────── */
    .chartwrap { width: 100%; overflow-x: auto; }
    .chartwrap svg { display: block; min-width: 420px; }

    /* 한도 대비 게이지 */
    .gauge { height: 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
             overflow: hidden; margin-top: 0.7rem; }
    .gauge i { display: block; height: 100%; background: var(--accent); transition: width 0.4s ease; }

    /* 별점 */
    .stars { color: var(--gold); font-size: 0.95rem; letter-spacing: 0.06em; flex-shrink: 0; }

    /* 눈에 띄어야 하는 표 줄 (반복된 연락처 시도) */
    table.tbl tr.hotrow td { background: rgba(207, 107, 96, 0.07); }
    table.tbl tr.hotrow:hover td { background: rgba(207, 107, 96, 0.12); }

    /* ── 모달 ─────────────────────────────────────────────────── */
    #modal { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; padding: 1.2rem; }
    #modal .bd { position: absolute; inset: 0; background: rgba(30, 25, 20, 0.45); animation: fadeIn 0.16s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #modal-box {
      position: relative; width: 100%; max-width: 420px; background: var(--card);
      border-radius: 18px; padding: 1.2rem 1.25rem; box-shadow: var(--sh3);
      max-height: 86vh; overflow-y: auto; animation: popIn 0.18s cubic-bezier(0.2, 0.9, 0.3, 1);
    }
    @keyframes popIn { from { transform: translateY(12px) scale(0.98); opacity: 0.5; } to { transform: none; opacity: 1; } }
    #modal-box h3 { font-size: 1.02rem; margin-bottom: 0.4rem; }
    #modal-box .body { font-size: 0.84rem; color: var(--sub); line-height: 1.7; white-space: pre-wrap; }
    #modal-box .acts { display: flex; gap: 0.5rem; margin-top: 1rem; }

    /* 토스트 */
    #toast {
      position: fixed; left: 50%; bottom: 1.6rem; z-index: 400;
      background: rgba(40, 34, 28, 0.95); color: #fff; padding: 0.62rem 1.15rem; border-radius: 999px;
      font-size: 0.82rem; opacity: 0; pointer-events: none; max-width: 90vw; text-align: center;
      transform: translateX(-50%) translateY(10px); transition: opacity 0.24s, transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 10px 28px rgba(30, 25, 20, 0.3);
    }
    #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 767px) { #toast { bottom: calc(var(--tabh) + 1.1rem + env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>

  <!-- ── 로그인 ───────────────────────────────────────────────── -->
  <div id="screen-login">
    <div class="logo">
      <div class="mark">운</div>
      <h1>우렁의사 운영자 콘솔</h1>
      <p>입점 심사 · 상담사 관리 · 정산 · 진단</p>
    </div>
    <div class="card">
      <p style="font-weight: 700; text-align: center;">운영자 코드</p>
      <p class="muted" style="text-align: center; margin: 0.35rem 0 0.9rem;">
        Worker 시크릿 <b>ADMIN_CODE</b> 를 입력하세요.<br>코드는 이 브라우저에만 저장됩니다.</p>
      <input id="adm-code" type="password" autocomplete="off" placeholder="ADMIN_CODE" inputmode="text">
      <p id="adm-err" class="muted" style="color: var(--danger); display: none; margin-top: 0.5rem; text-align: center;"></p>
      <button class="btn" id="adm-go" style="margin-top: 0.7rem;">입장</button>
    </div>
    <p class="muted" style="text-align: center; padding: 0 0.5rem;">
      이 화면은 운영자 전용입니다. 코드가 새면 전체 예약·정산 내역이 열립니다.<br>
      샜다고 생각되면 즉시 Worker 시크릿을 교체하세요.</p>
  </div>

  <!-- ── 앱 ───────────────────────────────────────────────────── -->
  <div id="shell" hidden>
    <aside id="sidenav">
      <div class="brand">
