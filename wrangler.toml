name = "cbt-proxy"
main = "cbtproxy.worker.js"
compatibility_date = "2024-11-01"

# 비밀값은 파일에 두지 말고 반드시 secret 으로 넣으세요:
#   wrangler secret put OPENAI_API_KEY
#   wrangler secret put ADMIN_CODE       (운영자 마스터 코드 — 전체 열람)
#   wrangler secret put DEEPSEEK_API_KEY (비교용 상담사 우렁의사 — DeepSeek)
#   wrangler secret put ALLOWED_ORIGIN   (선택)

#   wrangler secret put VAPID_PRIVATE    (웹 푸시 서명키 — 절대 코드에 두지 말 것)

#   FCM (스토어 앱 알림) — 셋을 모두 넣어야 켜진다. 하나라도 없으면
#    FCM 발송만 조용히 건너뛰고 웹푸시는 그대로 나간다. 자세한 건 android/FCM-설정방법.md
#   wrangler secret put FCM_PROJECT_ID
#   wrangler secret put FCM_CLIENT_EMAIL
#   wrangler secret put FCM_PRIVATE_KEY

# VAPID 공개키는 말 그대로 공개값입니다. 상담사 앱(pro/index.html)에도
#  똑같은 값이 박혀 있어야 하며, 두 값이 다르면 푸시 구독이 조용히 실패합니다.
[vars]
# TURN 릴레이 — STUN 만으로는 LTE↔LTE·회사망에서 P2P 가 안 붙는다.
#  openrelay(공개 무료)는 2026-08 실측 결과 죽어 있어 제거했다.
#  Cloudflare Calls TURN 을 쓴다 — 대시보드에서 TURN 앱을 만들고 두 시크릿을 넣으면 켜진다:
#    npx wrangler secret put CF_TURN_KEY_ID
#    npx wrangler secret put CF_TURN_KEY_TOKEN
#  (rtc.js /rtc/ice 가 짧은 TTL 자격증명을 자동 발급·캐시한다)
VAPID_PUBLIC = "BG_UE9SHpc89xc3kpLthgs4q1oFPHzA_6xUm25mxOYPaSnirh-hbUxEKThUB3iRY8jlRxxLREM1rnDp_qUvI9uc"
VAPID_SUBJECT = "mailto:help@neurumind.com"

# 상담사 앱(마인드 인사이드 프로)의 주소. 메일에 넣는 로그인 링크가 여기로 간다.
#  Pages 프로젝트는 neurumind-pro, 커스텀 도메인은 pro.mindinsideapp.com (옛 pro.neurumind.com 도 붙어 있다).
PRO_URL = "https://pro.mindinsideapp.com"

# 의사(담당의) 앱 주소. 매직링크 메일과 긴급 알림 메일의 버튼이 여기로 간다.
#  Pages 프로젝트는 neurumind-doc, 커스텀 도메인은 doc.mindinsideapp.com.
DOC_URL = "https://doc.mindinsideapp.com"

# 소개 페이지(neurumind.com/intro/)에서 팀원이 테스트 코드를 열어보는 비밀번호.
#  진짜 비밀이 아니라 '팀원끼리 아는 번호' 수준이다. 운영자 코드가 같이 열리니 새면 ADMIN_CODE 를 돌려라.
INTRO_PW = "1234"

# 상담사 마켓 저장소. 먼저 만들고 아래 database_id 를 채우세요:
#   wrangler d1 create hongcbt
#   wrangler d1 execute hongcbt --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "hongcbt"
database_id = "5dcfef89-b75e-4867-a2f5-59b28ab4fa3d"

# 실시간 허브 — 채팅을 폴링(8~15초) 대신 웹소켓으로 즉시 밀어준다
[[durable_objects.bindings]]
name = "HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatHub"]

# 야간 청소 — 한국시간 새벽 3시(UTC 18시)에 오래된 기록을 정리한다
[triggers]
crons = ["0 18 * * *"]

#   내 주변 정신과 — 건강보험심사평가원 병원정보서비스(data.go.kr) 인증키. 없으면 전국 수집이 꺼진다.
#   wrangler secret put HIRA_KEY          (data.go.kr 마이페이지 → 활용신청 현황 → 일반 인증키 Decoding 값)

# ── 악용·과부하 방지 (Workers Rate Limiting) ─────────────────────────────
#  스크립트로 요청을 퍼붓거나 코드를 찍어 보는 걸 서버 앞단에서 끊는다.
#  period 는 10 또는 60 초만 된다. 키는 코드에서 정한다(IP·기기 id).
#  값은 정상 사용의 몇 배로 넉넉히 잡았다 — 병원 한 곳이 IP 하나를 같이 써도 막히지 않게.
[[ratelimits]]
name = "RL_IP"            # 모든 요청 · IP당 분당 300
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_WRITE"         # 쓰기(POST) · IP당 분당 60
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_AUTH"          # 코드·로그인·운영자 경로 · IP당 분당 60 (코드 찍어보기 차단)
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_ACT"           # 사람 행동(예약·채팅·전화) · 기기당 분당 12
namespace_id = "1004"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "RL_MSG"           # 채팅 · 기기당 분당 30
namespace_id = "1005"
simple = { limit = 30, period = 60 }
