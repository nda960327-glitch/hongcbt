<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="우렁이 대성통곡"> <style> .wr2-woorung-bigcry-body{animation:wr2-woorung-bigcry-heave 0.5s ease-in-out infinite} .wr2-woorung-bigcry-f1{animation:wr2-woorung-bigcry-spray 0.8s ease-out infinite} .wr2-woorung-bigcry-f2{animation:wr2-woorung-bigcry-spray 0.8s ease-out 0.4s infinite} @keyframes wr2-woorung-bigcry-heave{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2.5px) scale(1.015,0.985)}} @keyframes wr2-woorung-bigcry-spray{0%{transform:translate(0,0) scale(0.5);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx,-14px),-4px) scale(1.15);opacity:0}}</style> <g class="wr2-woorung-bigcry-body"> <!-- 뚱뚱 찹쌀떡 몸 (손그림 울퉁불퉁) --> <path d="M70 42 C 89 41, 106 50, 112 65 C 117 77, 119 94, 112 106 C 104 119, 90 125, 70 125 C 50 126, 35 119, 27 106 C 20 94, 22 77, 28 64 C 34 50, 51 43, 70 42 Z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.6" stroke-linejoin="round"/> <!-- 콩알 발 --> <path d="M50 124 q4 6 10 1" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <path d="M80 125 q4 6 10 0" fill="none" stroke="#8A6F55" stroke-width="3" stroke-linecap="round"/> <!-- 아무것도 못 할 것 같은 짜리몽땅 팔 --> <path class="wr2-woorung-bigcry-armL" d="M27 92 q-9 3 -7 11 q8 2 10 -4 q1 -5 -3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <path class="wr2-woorung-bigcry-armR" d="M113 92 q9 3 7 11 q-8 2 -10 -4 q-1 -5 3 -7z" fill="#FFF9F0" stroke="#8A6F55" stroke-width="3.2" stroke-linejoin="round"/> <!-- 스킨별 시그니처 장식 --> <g> <circle cx="103" cy="52" r="15" fill="#BBD7C0" stroke="#7FA78C" stroke-width="3"/> <path d="M103 52 m0 -9 a9 9 0 1 1 -9 9 a6.4 6.4 0 1 0 6.4 -6.4 a4 4 0 1 1 -4 4" fill="none" stroke="#7FA78C" stroke-width="2.2" stroke-linecap="round"/> </g> <path d="M36 50 q30 -16 62 -4" fill="none" stroke="#B79B7C" stroke-width="2.2" opacity="0.5"/> <g transform="rotate(-8 44 42)"> <circle cx="44" cy="42" r="7.5" fill="#F4F7F6" stroke="#8FA8B8" stroke-width="2.6"/> <circle cx="44" cy="42" r="2.6" fill="#C9D8E2"/> </g> <!-- 큼직한 볼터치 (얼굴 아래쪽) --> <circle class="wr2-woorung-bigcry-cheek" cx="42" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <circle class="wr2-woorung-bigcry-cheek" cx="98" cy="96" r="8" fill="#F9BCA4" opacity="0.85"/> <path d="M46 84 q6 4 12 0" fill="none" stroke="#3F352A" stroke-width="3" stroke-linecap="round"/> <path d="M82 84 q6 4 12 0" fill="none" stroke="#3F352A" stroke-width="3" stroke-linecap="round"/> <path d="M58 96 q12 12 24 0 q-12 6 -24 0z" fill="#C97B72" stroke="#3F352A" stroke-width="2.6" stroke-linejoin="round"/> <!-- 얼굴 위에 얹히는 시그니처 (안경처럼 눈을 가리면 안 되는 것) --> <!-- 옷장에서 착용한 아이템 — 방 안 우렁이와 탈의실에서만 입는다. 채팅 아바타·이모티콘까지 옷이 따라다니면 표정이 묻힌다. --> </g><g class="wr2-woorung-bigcry-f1" style="--dx:-16px"><path d="M45 83 q-7 2 -9 8 q6 2 9 -3z" fill="#A9CDEC"/></g> <g class="wr2-woorung-bigcry-f2" style="--dx:16px"><path d="M95 83 q7 2 9 8 q-6 2 -9 -3z" fill="#A9CDEC"/></g>
</svg>
